# ============================================================
# 票务系统 生产环境 Nginx 配置
# 适用: Linux 服务器 (路径按实际调整) / Windows 本机联调
# 部署产物:
#   - H5 静态文件: D:\TicketSystem\frontend\dist\build\h5  (npm run build:h5 生成)
#   - Django API:  后端以 gunicorn / waitress 运行在 127.0.0.1:8000
# ============================================================

# 如果服务器有域名并申请了证书，放开下面两段 443 配置
# upstream django_api {
#     server 127.0.0.1:8000;
# }

server {
    listen 80;
    # server_name your-domain.com;   # 换成你的域名

    # 上传大小限制（封面图等）
    client_max_body_size 20m;

    # 开启 gzip 压缩
    gzip on;
    gzip_types text/plain text/css application/json application/javascript image/svg+xml;
    gzip_min_length 1k;

    # ---------- 1. H5 前端静态页面 ----------
    root /www/ticketsystem/frontend/dist/build/h5;   # Linux 路径示例
    # root D:/TicketSystem/frontend/dist/build/h5;   # Windows 本机联调用这行

    index index.html;

    # SPA 路由回退：刷新任意子路由都回到 index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # 静态资源缓存（带 hash 的文件可长缓存）
    location /assets/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # ---------- 2. API 反向代理到 Django ----------
    location /api/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 10s;
        proxy_read_timeout 60s;
    }

    # ---------- 3. Django 管理后台 ----------
    location /admin/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # ---------- 4. 上传的媒体文件（封面图等） ----------
    location /media/ {
        alias /www/ticketsystem/backend/media/;      # Linux 路径示例
        # alias D:/TicketSystem/backend/media/;      # Windows 本机联调用这行
        expires 7d;
    }
}

